server {
    listen 80;
    server_name api.meridian-demo.com;

    # After DNS points to the VM, use Certbot's Nginx plugin to add TLS:
    # sudo certbot --nginx -d api.meridian-demo.com
    # Certbot adds the HTTPS listener and certificate directives here.
    # Enable HTTP-to-HTTPS redirects before sending credentials to this API.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
